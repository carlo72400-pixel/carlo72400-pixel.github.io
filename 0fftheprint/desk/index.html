<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Desk · 0FF THE PRINT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/auth.css">
<style>
  .post-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
    padding:13px 4px;border-bottom:1px solid var(--line)}
  .post-row .txt{font-size:14px;line-height:1.5}
  .post-row .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-top:5px}
  .gone{opacity:.4}
</style>
</head>
<body>
<div class="leopard-bar"></div>
<div class="wrap wide">
  <a class="back" href="../">&larr; 0FF THE PRINT</a>
  <h1>The Desk</h1>
  <div class="sub">who gets in &nbsp;·&nbsp; what stays up</div>
  <div id="panel"><div class="empty">checking…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js?v=f1348482"></script>
<script src="../assets/js/desk.js?v=41c8584c"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const panel = $('panel');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };

  if (!OTP.configured) {
    panel.innerHTML = `<div class="setup"><b>Backend not switched on yet</b>
      Run <code>schema.sql</code> in Supabase and fill in <code>supabase-config.js</code>.
      Full walkthrough is in <code>SUPABASE_SETUP.md</code>.</div>`;
    return;
  }
  const me = await OTP.me();
  if (!me) { location.href = '../join/'; return; }
  if (!me.profile?.is_admin) {
    panel.innerHTML = `<div class="card"><b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">Desk only.</b>
      <div class="note">Signed in as ${esc(me.user.email)}, but this page is the owner's.</div>
      <button class="btn ghost" id="out" type="button">Sign out</button></div>`;
    $('out').onclick = async () => { await OTP.signOut(); location.href = '../join/'; };
    return;
  }

  async function render() {
    const [pending, members, posts] = await Promise.all([
      OTP.pending(), OTP.members(), OTP.allPosts(40)
    ]);

    panel.innerHTML = `
      <div class="card">
        <div class="who">signed in as <b>${esc(me.profile.display_name)}</b>
          <button class="btn ghost sm" id="out" type="button">Sign out</button></div>
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Waiting on you ${pending.length ? `<span class="pill wait">${pending.length}</span>` : ''}</b>
        ${pending.length ? pending.map(p => `
          <div class="person">
            <div><b>${esc(p.display_name)}</b>
              <div class="meta">${esc(p.card_slug || 'no card picked')} &nbsp;·&nbsp; asked ${when(p.created_at)}</div></div>
            <div class="row">
              <button class="btn ok sm" data-ok="${p.id}" type="button">Approve</button>
            </div>
          </div>`).join('') : '<div class="empty">nobody waiting</div>'}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Card holders</b>
        ${members.length ? members.map(p => `
          <div class="person">
            <div><b>${esc(p.display_name)}</b>
              <div class="meta">${esc(p.card_slug || '—')} ${p.is_admin ? '<span class="pill ok">DESK</span>' : ''}</div></div>
            <div class="row">
              ${p.is_admin ? '' : `<button class="btn bad sm" data-no="${p.id}" type="button">Revoke</button>`}
            </div>
          </div>`).join('') : '<div class="empty">nobody approved yet</div>'}
      </div>

      <div class="card">
        <b style="font-family:var(--f-display);font-style:italic;font-size:24px;text-transform:uppercase">
          Recent posts</b>
        ${posts.length ? posts.map(p => `
          <div class="post-row ${p.published ? '' : 'gone'}">
            <div>
              <div class="txt">${esc((p.text || '').slice(0, 180))}</div>
              <div class="meta">${esc(p.profiles?.display_name || '?')} &nbsp;·&nbsp; ${when(p.created_at)}
                ${p.published ? '' : '&nbsp;·&nbsp; PULLED'}</div>
            </div>
            <div class="row">
              ${p.published ? `<button class="btn bad sm" data-pull="${p.id}" type="button">Pull</button>` : ''}
            </div>
          </div>`).join('') : '<div class="empty">no posts yet</div>'}
      </div>`;

    $('out').onclick = async () => { await OTP.signOut(); location.href = '../join/'; };
    panel.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
      b.disabled = true; await OTP.setApproved(b.dataset.ok, true); render();
    });
    panel.querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
      if (!confirm('Revoke posting access for this person?')) return;
      b.disabled = true; await OTP.setApproved(b.dataset.no, false); render();
    });
    panel.querySelectorAll('[data-pull]').forEach(b => b.onclick = async () => {
      if (!confirm('Pull this post off the site?')) return;
      b.disabled = true; await OTP.pullPost(b.dataset.pull); render();
    });
  }
  render();
})();
</script>
</body>
</html>
