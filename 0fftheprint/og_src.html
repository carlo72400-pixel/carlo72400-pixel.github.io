<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- OG source for assets/preview.jpg. Headless Chrome will NOT fetch Google Fonts;
     download the woff2 files and @font-face them locally to re-render. -->
<link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f7f5ef;position:relative;overflow:hidden;
padding:52px 62px;display:flex;flex-direction:column;justify-content:center;}
body::after{content:'';position:absolute;inset:0;pointer-events:none;
background:repeating-linear-gradient(0deg, rgba(23,21,15,.03) 0 1px, transparent 1px 3px);}
.perf{position:absolute;left:0;right:0;top:0;height:13px;
background:repeating-linear-gradient(90deg,#17150f 0 18px, transparent 18px 30px);}
.perf.b{top:auto;bottom:0;}
.kick{font-family:'Courier Prime',monospace;font-weight:700;font-size:21px;letter-spacing:.3em;color:#4d473d;}
h1{font-family:'Allerta Stencil',sans-serif;font-size:150px;line-height:.92;letter-spacing:.008em;
color:#17150f;margin:20px 0 6px;text-shadow:6px 6px 0 #e5378f;}
.line{font-family:'Allerta Stencil',sans-serif;font-size:41px;line-height:1.12;color:#17150f;margin-top:26px;}
.line b{color:#c2185b;font-weight:400;}
.foot{position:absolute;left:62px;bottom:44px;right:62px;display:flex;justify-content:space-between;align-items:flex-end;}
.box{font-family:'Courier Prime',monospace;font-weight:700;font-size:19px;letter-spacing:.16em;color:#17150f;
border:3px solid #17150f;padding:11px 20px;box-shadow:5px 5px 0 #f9c9e0;}
.file{font-family:'Special Elite',serif;font-size:20px;letter-spacing:.2em;color:#4d473d;}
</style></head>
<body>
<div class="perf"></div>
<div class="kick">MEDIA HOUSE &middot; SAN ANTONIO TX</div>
<h1>0FF THE PRINT</h1>
<div class="line">WE GOT A VAMPIRE ON THIS.<br><b>NOBODY'S COMPLAINED YET.</b></div>
<div class="foot">
  <span class="box">FILE COPY &middot; NO. 0TP</span>
  <span class="file">OFF THE RECORD STAYS OFF THE RECORD</span>
</div>
<div class="perf b"></div>
</body></html>
